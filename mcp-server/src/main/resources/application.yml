server:
  port: 8081

spring:
  application:
    name: sggis-mcp-server
  ai:
    mcp:
      server:
        # Each tool call is self-contained, so replicas can serve requests without session affinity.
        protocol: STATELESS
        name: sggis-mcp-server
        version: 1.0.0
        type: SYNC
        instructions: "提供精确计算、电源追溯、线路配变、地址周边设备、设备定位、托管图层查看、几何区域绘制和基建工程浏览工具。多候选结果必须先由用户确认；地图场景工具返回的 action 和 actionParams 交由前端渲染。"
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

logging:
  level:
    org.springframework.ai.mcp: INFO
