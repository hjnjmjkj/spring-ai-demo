spring:
  config:
    activate:
      on-profile: intranet
  ai:
    openai:
      api-key: ${INTRANET_LLM_API_KEY:EMPTY}
      timeout: 120s
      chat:
        base-url: ${INTRANET_LLM_BASE_URL:http://27.196.211.151:19090/v1}
        options:
          model: ${INTRANET_LLM_MODEL:Qwen}
          temperature: 0.2
      # Keep embeddings on the intranet as well so RAG content is never sent outside.
      embedding:
        # The OpenAI-compatible client appends /embeddings to this /v1 base URL.
        base-url: ${INTRANET_EMBEDDING_BASE_URL:http://27.196.211.151:19090/v1}
        options:
          model: ${INTRANET_EMBEDDING_MODEL:bge-base-zh-v1.5}
          dimensions: ${INTRANET_EMBEDDING_DIMENSIONS:768}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${INTRANET_EMBEDDING_DIMENSIONS:768}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-name: public
        table-name: vector_store
