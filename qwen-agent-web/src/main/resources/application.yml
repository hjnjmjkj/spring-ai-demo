server:
  port: 8080

agent:
  skills:
    directory: ${AGENT_SKILLS_DIRECTORY:skills}

spring:
  application:
    name: qwen-agent-web
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:extranet}
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5555}/${POSTGRES_DB:pgvector}
    username: ${POSTGRES_USER:pgvector}
    password: ${POSTGRES_PASSWORD:pgvector}
  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      client:
        name: qwen-agent-mcp-client
        version: 1.0.0
        type: SYNC
        initialized: true
        request-timeout: 30s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            calculator:
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp

logging:
  level:
    org.springframework.ai.mcp: INFO
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
